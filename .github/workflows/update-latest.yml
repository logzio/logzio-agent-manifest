name: update latest release
on:
  push:
    branches:
      - master

jobs:
  filter_for_configs:
    name: Filter for configs folder changes
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.filter.outputs.configs }}
    steps:
      - uses: actions/checkout@v3
      - name: Set filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            configs:
              - 'configs/**'

  update_latest:
    name: Update latest release
    needs: filter_for_configs
    permissions:
      contents: write  # Allows pushing changes to the repository
      attestations: write  # Allows adding and updating artifact attestations
    if: ${{ needs.filter_for_configs.outputs.configs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Build manifest
        uses: jannekem/run-python-script-action@9d8e2e0878d575fb6073277f38ce3f10ebf4f059 # v1
        with:
          script: |
            import os, json
            configs = []
            entries = os.scandir('configs')
            sorted_entries = sorted(entries, key=lambda x: x.name)
            for filename in sorted_entries:
              with open(filename, mode='r', encoding='utf-8') as file:
                configs.append(json.load(file))
            with open("manifest.json", mode='w', encoding='utf-8') as f:
              f.truncate(0)
              json.dump(configs, f)
      - name: Update latest release
        uses: meeDamian/github-release@7ae19492500104f636b3fee4d8103af0fed36c8e # 2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: latest
          tag: latest
          allow_override: true
          prerelease: true
          files: manifest.json
          gzip: false